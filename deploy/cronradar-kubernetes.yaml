# Rendered from charts/cronradar-kubernetes with default values; watches every namespace.
# Create the API key Secret first (README, "Install with kubectl").
apiVersion: v1
kind: Namespace
metadata:
  name: cronradar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronradar-kubernetes
  namespace: cronradar
  labels:
    app.kubernetes.io/name: cronradar-kubernetes
    app.kubernetes.io/instance: cronradar-kubernetes
    app.kubernetes.io/version: "0.1.0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronradar-kubernetes
  labels:
    app.kubernetes.io/name: cronradar-kubernetes
    app.kubernetes.io/instance: cronradar-kubernetes
    app.kubernetes.io/version: "0.1.0"
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronradar-kubernetes
  labels:
    app.kubernetes.io/name: cronradar-kubernetes
    app.kubernetes.io/instance: cronradar-kubernetes
    app.kubernetes.io/version: "0.1.0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronradar-kubernetes
subjects:
  - kind: ServiceAccount
    name: cronradar-kubernetes
    namespace: cronradar
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronradar-kubernetes
  namespace: cronradar
  labels:
    app.kubernetes.io/name: cronradar-kubernetes
    app.kubernetes.io/instance: cronradar-kubernetes
    app.kubernetes.io/version: "0.1.0"
spec:
  # One replica: a second would report every run twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cronradar-kubernetes
      app.kubernetes.io/instance: cronradar-kubernetes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronradar-kubernetes
        app.kubernetes.io/instance: cronradar-kubernetes
    spec:
      serviceAccountName: cronradar-kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cronradar-kubernetes
          image: ghcr.io/notinferred/cronradar-kubernetes:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CRONRADAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cronradar-api-key
                  key: api-key
            - name: CRONRADAR_NAMESPACES
              value: ""
            - name: CRONRADAR_SYNC_INTERVAL
              value: "5m"
            - name: CRONRADAR_SOURCE
              value: "kubernetes"
            - name: CRONRADAR_TIME_ZONE
              value: "UTC"
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
