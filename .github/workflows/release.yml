name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/notinferred/cronradar-kubernetes
  CHART_REGISTRY: oci://ghcr.io/notinferred/charts

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # GitHub release with the packaged chart
      packages: write # image and chart in GHCR
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4' # same Go as the Dockerfile builder; go.mod's go line is only the minimum

      - name: Check the tag matches the declared versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          grep -qx "version: $version" charts/cronradar-kubernetes/Chart.yaml
          grep -qx "appVersion: \"$version\"" charts/cronradar-kubernetes/Chart.yaml
          grep -q "var version = \"$version\"" cmd/cronradar-kubernetes/main.go
          grep -q "cronradar-kubernetes:$version" deploy/cronradar-kubernetes.yaml
          grep -q "^## \[$version\]" CHANGELOG.md

      - name: Test
        run: go test -race -count=1 ./...

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/notinferred/cronradar-kubernetes
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true

      - name: Package and push the chart
        run: |
          helm package charts/cronradar-kubernetes --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/cronradar-kubernetes-$VERSION.tgz" "$CHART_REGISTRY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/cronradar-kubernetes-$VERSION.tgz" deploy/cronradar-kubernetes.yaml \
            --title "$GITHUB_REF_NAME" \
            --notes "Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`). Chart: \`$CHART_REGISTRY/cronradar-kubernetes --version $VERSION\`. See CHANGELOG.md."
